[project]
name = "orange-errand-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "anthropic==1.8.0",
  "langgraph==1.2.19",
  "langgraph-checkpoint-sqlite==3.1.3",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["errand*"]
